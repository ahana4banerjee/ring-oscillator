# Optimization Pipeline Configuration

circuit:
  baseline_netlist: "circuits/baseline/ring_oscillator.asc"
  template_netlist: "circuits/templates/ring_oscillator.net"
  models_path: "circuits/models/"
  stages: 5
  vdd: 1.1                     # Supply Voltage (V)
  nominal_wn: 0.5e-6           # Baseline NMOS width (m)
  nominal_wp: 1.0e-6           # Baseline PMOS width (m)
  length: 0.04e-6              # Channel length (m)

simulation:
  ltspice_executable: "C:\\Users\\Ahana Banerjee\\AppData\\Local\\Programs\\ADI\\LTspice\\LTspice.exe"
  transient_stop: "1n"
  transient_start_save: "0.2n"
  max_step: "0.01p"
  timeout_seconds: 30

search_space:
  wn_min: 0.18e-6
  wn_max: 0.80e-6
  wp_min: 0.36e-6
  wp_max: 1.60e-6
  step_size: 10e-9             # Grid snapping (10nm)

normalization:
  baseline_frequency_hz: 41069756649.1  # 41.0697566491 GHz from 40nm baseline (0.5u/1.0u @ 1.1V)
  baseline_power_w: 0.000140169553568    # 140.169553568 uW from 40nm baseline (0.5u/1.0u @ 1.1V)

optimization:
  method: "bayesian"           # "bayesian" or "random"
  seed: 42
  max_iterations: 50
  n_initial_samples: 10
  objective_mode: "weighted"   # "weighted" or "pdp"
  profile: "balanced"          # "balanced" (0.5/0.5) or "speed_biased" (0.7/0.3)
  profiles:
    balanced:
      w_f: 0.5
      w_p: 0.5
    speed_biased:
      w_f: 0.7
      w_p: 0.3
  penalty_value: -1.0e9        # Penalty score for failed/non-oscillating circuits

logging:
  results_csv: "results/processed/experiment_log.csv"
  summary_json: "results/processed/run_summary.json"
  plots_dir: "results/plots/"
